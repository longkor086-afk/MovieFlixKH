<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909">
<title>MovieFlixKH Admin</title>
<link rel="stylesheet" href="admin.css">
<script src="admin.js" defer></script>
</head>
<body>
<header class="adminHeader">
  <a href="../" class="logo" aria-label="MovieFlixKH">🎬 Movie<span>Flix</span>KH <small>ADMIN</small></a>
  <button id="refreshButton" class="secondary" type="button">🔄 Refresh</button>
</header>

<main class="container">
  <section class="stats">
    <div><span>🎬 Movies</span><strong id="movieCount">0</strong></div>
    <div><span>🇰🇭 Khmer Audio</span><strong id="khmerCount">0</strong></div>
    <div><span>✅ Licensed</span><strong id="licensedCount">0</strong></div>
  </section>

  <div id="adminMessage" class="message" hidden></div>

  <section class="panel">
    <div class="panelHead">
      <div><small>CONTENT MANAGEMENT</small><h1>➕ Add Movie</h1></div>
      <a href="../" class="secondary">🎬 View Website</a>
    </div>

    <form id="movieForm" autocomplete="off">
      <div class="formGrid">
        <div class="field"><label for="movieId">Movie ID</label><input id="movieId" placeholder="movie_123"></div>
        <div class="field required"><label for="title">Title *</label><input id="title" required placeholder="Movie title"></div>
        <div class="field"><label for="titleKh">ចំណងជើងខ្មែរ</label><input id="titleKh" placeholder="ឈ្មោះភាពយន្តជាខ្មែរ"></div>
        <div class="field"><label for="year">Year</label><input id="year" inputmode="numeric" placeholder="2026"></div>
        <div class="field"><label for="country">Country</label><input id="country" placeholder="Korea, China, USA..."></div>
        <div class="field"><label for="duration">Duration</label><input id="duration" placeholder="1h 45m"></div>
        <div class="field"><label for="quality">Quality</label><input id="quality" value="1080P" placeholder="1080P"></div>
        <div class="field"><label for="rating">Rating</label><input id="rating" type="number" min="0" max="10" step="0.1" placeholder="8.5"></div>
        <div class="field"><label for="language">Language</label><input id="language" placeholder="Korean / Chinese / English"></div>
        <div class="field"><label for="subtitle">Subtitle</label><input id="subtitle" placeholder="Khmer / English / None"></div>
        <div class="field"><label for="genre">Genre</label><input id="genre" placeholder="Action, Drama, Romance"></div>
        <div class="field"><label for="license">License</label>
          <select id="license">
            <option value="">Select license</option>
            <option value="owned">Owned</option>
            <option value="licensed">Licensed</option>
            <option value="public-domain">Public Domain</option>
            <option value="creative-commons">Creative Commons</option>
          </select>
        </div>
        <div class="field full"><label for="poster">Poster URL</label><input id="poster" type="url" placeholder="https://..."></div>
        <div class="field full"><label for="backdrop">Backdrop URL</label><input id="backdrop" type="url" placeholder="https://..."></div>
        <div class="field full"><label for="videoFileId">Telegram Video File ID</label><input id="videoFileId" placeholder="BAACAg..."></div>
        <div class="field"><label for="khmerAudio">Khmer Audio</label><input id="khmerAudio" placeholder="Yes / No / URL"></div>
        <div class="field"><label for="khmerSubtitle">Khmer Subtitle</label><input id="khmerSubtitle" placeholder="Yes / No / URL"></div>
        <div class="field full"><label for="source">Source</label><input id="source" placeholder="Source / rights information"></div>
        <div class="field full"><label for="description">Description</label><textarea id="description" rows="4" placeholder="Movie description..."></textarea></div>
        <div class="field full"><label for="descriptionKh">Description Khmer</label><textarea id="descriptionKh" rows="4" placeholder="ការពិពណ៌នាភាពយន្តជាខ្មែរ..."></textarea></div>
      </div>

      <div class="formActions">
        <button id="saveButton" class="primary" type="submit">💾 Save Movie</button>
        <button id="resetButton" class="secondary" type="reset">↩️ Clear</button>
      </div>
    </form>
  </section>

  <section class="panel">
    <div class="panelHead"><div><small>LIBRARY</small><h2>🎞️ Movies</h2></div></div>
    <div id="movieList" class="movieList"><p class="muted">កំពុងផ្ទុក...</p></div>
  </section>
</main>
</body>
</html>
